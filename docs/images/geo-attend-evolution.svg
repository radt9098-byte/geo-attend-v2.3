<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="414" viewBox="0 0 1200 414" role="img" aria-labelledby="title desc"><title id="title">The evolution of Geo Attend</title><desc id="desc">Six milestones from office attendance to field work and improved recovery.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#123e38"/><stop offset=".55" stop-color="#101b2a"/><stop offset="1" stop-color="#090c11"/></linearGradient><linearGradient id="mint"><stop stop-color="#80efca"/><stop offset="1" stop-color="#45bda7"/></linearGradient></defs><rect width="1200" height="414" rx="28" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif">
<text x="44" y="62" fill="#80efca" font-size="15" letter-spacing="3">BUILT THROUGH ITERATION</text><text x="44" y="108" fill="#f1fbf7" font-size="34" font-weight="700">Every release answered a real workplace problem.</text>
